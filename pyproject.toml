[project]
name = "youtube-content-brain"
version = "0.1.0"
description = "Provider-independent YouTube psychology content package generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.scripts]
content-brain = "content_brain.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/content_brain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
